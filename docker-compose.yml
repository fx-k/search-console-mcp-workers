name: search-console-mcp

services:
  search-console-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TUNNEL_CLIENT_VERSION: ${TUNNEL_CLIENT_VERSION:-v0.0.14}

    image: fxit/search-console-mcp:${MCP_IMAGE_TAG:-0.5.0-tunnel-0.0.14}
    container_name: search-console-mcp

    restart: unless-stopped

    env_file:
      - .env

    environment:
      MCP_COMMAND: "node /app/src/runtime/stdio.js"
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google_service_account
      BING_API_KEY_FILE: /run/secrets/bing_api_key
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
      LOG_LEVEL: info
      LOG_FORMAT: json

    command:
      - "--control-plane.api-key=file:/run/secrets/openai_tunnel_api_key"

    secrets:
      - google_service_account
      - bing_api_key
      - openai_tunnel_api_key

    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

    mem_limit: 256m
    mem_reservation: 64m

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/readyz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  google_service_account:
    file: ./secrets/google-service-account.json
  bing_api_key:
    file: ./secrets/bing-api-key
  openai_tunnel_api_key:
    file: ./secrets/openai-tunnel-api-key
