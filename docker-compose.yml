name: mcp-search-console

services:
  egress-proxy:
    image: gogost/gost:3.3
    container_name: mcp-search-console-egress

    restart: unless-stopped

    # 只给 OpenAI Tunnel control-plane 使用：
    # tunnel-client -> HTTP CONNECT -> gost -> SOCKS5 upstream -> OpenAI
    command:
      - "-L"
      - "http://:18080"
      - "-F"
      - "${SOCKS5_UPSTREAM:?SOCKS5_UPSTREAM is required}"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 64

    mem_limit: 32m
    mem_reservation: 8m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  mcp-search-console:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TUNNEL_CLIENT_VERSION: ${TUNNEL_CLIENT_VERSION:-v0.0.14}

    image: fxit/mcp-search-console:${MCP_IMAGE_TAG:-0.5.0-tunnel-0.0.14}
    container_name: mcp-search-console

    restart: unless-stopped

    depends_on:
      - egress-proxy

    env_file:
      - .env

    environment:
      MCP_COMMAND: "node /app/src/runtime/stdio.js"
      # IMPORTANT:
      # 只代理 tunnel-client -> OpenAI control plane。
      # 不设置 HTTP_PROXY / HTTPS_PROXY / ALL_PROXY，
      # 因而 stdio 子进程访问 Bing/Google/PageSpeed 仍直接走 VPS 出口 IP。
      CONTROL_PLANE_HTTP_PROXY: http://egress-proxy:18080

      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
      LOG_LEVEL: info
      LOG_FORMAT: json

    secrets:
      - google_service_account
      - bing_api_key
      - openai_tunnel_api_key

    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

    mem_limit: 256m
    mem_reservation: 64m

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/readyz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  google_service_account:
    file: ./secrets/google-service-account.json
  bing_api_key:
    file: ./secrets/bing-api-key
  openai_tunnel_api_key:
    file: ./secrets/openai-tunnel-api-key
